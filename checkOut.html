<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Burger King</title>
  <!-- External CSS (shared by every page) -->
  <link rel="stylesheet" href="style.css">
  <!-- Internal CSS: demonstrates page-specific embedded styling -->
  <style>
    .form-card { border-top: 5px solid #d62300; }
  </style>
</head>
<body>
  <header class="site-header" style="border-top: 4px solid #ffb36b;">
    <h1><img src="images/Burger-King-Logo.png" alt="Burger King Logo" width="95"> Burger King</h1>
  </header>
  <nav aria-label="Main navigation"><ul>
    <li><a href="index.html"><img src="images/home.png" alt="" width="22"> Home</a></li>
<li><a href="menu.html"><img src="images/fast-food.png" alt="" width="22"> Menu</a></li>
<li><a href="login.html"><img src="images/login.png" alt="" width="22"> Login</a></li>
<li><a href="signup.html">Sign Up</a></li>
<li><a href="aboutUs.html"><img src="images/information-button.png" alt="" width="22"> About Us</a></li>
  </ul></nav>
  <main>
  <section class="card form-card"><h2 class="page-title">Checkout</h2>
<form onsubmit="return validateCheckout()" novalidate><label for="name">Name:</label><input type="text" name="name" id="name" required>
<label for="address">Address:</label><input type="text" name="address" id="address" required>
<label for="paymentMethod">Payment Method:</label><select name="paymentMethod" id="paymentMethod"><option value="cash">Cash</option><option value="card">Credit Card</option></select>
<input type="submit" value="Check Information">
<p id="checkoutResult" aria-live="polite"></p></form></section><section class="card"><div class="center-text"><p class="small-note">Click the logo to visit About Us:</p><img src="images/Burger-King-Logo.png" alt="Burger King information" usemap="#siteMap" width="100" height="100"><map name="siteMap"><area shape="rect" coords="0,0,100,100" href="aboutUs.html" alt="About Us"></map></div></section>
  </main>
  <footer><p>&copy; 2026 Burger King.</p></footer>
  <script src="script.js"></script>
</body>
</html>
