<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Burger King</title>
  <!-- External CSS (shared by every page) -->
  <link rel="stylesheet" href="style.css">
  <!-- Internal CSS: demonstrates page-specific embedded styling -->
  <style>
    .form-card h2 { border-bottom: 2px solid #eac29c; padding-bottom: 12px; }
  </style>
</head>
<body>
  <header class="site-header" style="border-top: 4px solid #ffb36b;">
    <h1><img src="images/Burger-King-Logo.png" alt="Burger King Logo" width="95"> Burger King</h1>
  </header>
  <nav aria-label="Main navigation"><ul>
    <li><a href="index.html"><img src="images/home.png" alt="" width="22"> Home</a></li>
<li><a href="menu.html"><img src="images/fast-food.png" alt="" width="22"> Menu</a></li>
<li><a href="login.html"><img src="images/login.png" alt="" width="22"> Login</a></li>
<li><a href="signup.html" aria-current="page" class="current">Sign Up</a></li>
<li><a href="aboutUs.html"><img src="images/information-button.png" alt="" width="22"> About Us</a></li>
  </ul></nav>
  <main>
  <section class="card form-card"><h2 class="page-title">Create an Account</h2>
<form onsubmit="return validateSignup()" novalidate><label for="name">Full Name:</label><input type="text" name="name" id="name" autocomplete="name" required>
<label for="email">Email:</label><input type="email" name="email" id="email" autocomplete="email" required>
<label for="password">Password:</label><input type="password" name="password" id="password" minlength="8" autocomplete="new-password" required>
<label for="confirmPassword">Confirm Password:</label><input type="password" name="confirmPassword" id="confirmPassword" minlength="8" autocomplete="new-password" required>
<input type="submit" value="Sign Up">
<p id="signupResult" aria-live="polite"></p></form><p class="center-text">Already registered? <a href="login.html">Login</a>.</p></section>
<section class="card"><div class="center-text"><p class="small-note">Click the logo to visit About Us:</p><img src="images/Burger-King-Logo.png" alt="Burger King information" usemap="#siteMap" width="100" height="100"><map name="siteMap"><area shape="rect" coords="0,0,100,100" href="aboutUs.html" alt="About Us"></map></div></section>
  </main>
  <footer><p>&copy; 2026 Burger King.</p></footer>
  <script src="script.js"></script>
</body>
</html>
