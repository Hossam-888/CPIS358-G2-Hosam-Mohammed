<head>
  <meta charset="UTF-8">

  <!-- External CSS (shared by every page) -->

  <!-- Internal CSS: demonstrates page-specific embedded styling -->
  <style>
    .offer-table tbody tr:hover { background-color: #ffe7d2; }
  </style>
</head>
<body>
  <header class="site-header" style="border-top: 4px solid #ffb36b;">
    <h1><img src="images/Burger-King-Logo.png" alt="Burger King Logo" width="95"> Burger King</h1>
  </header>
  <nav aria-label="Main navigation"><ul>
    <li><a href="index.html"><img src="images/home.png" alt="" width="22"> Home</a></li>
<li><a href="menu.html" aria-current="page" class="current"><img src="images/fast-food.png" alt="" width="22"> Menu</a></li>
<li><a href="login.html"><img src="images/login.png" alt="" width="22"> Login</a></li>

<li><a href="aboutUs.html"><img src="images/information-button.png" alt="" width="22"> About Us</a></li>
  </ul></nav>
  <main>
  <section class="card form-card"><h2 class="page-title">Our Menu</h2>
  <p class="page-intro">Choose pickup or delivery and select your meal.</p>
  <form action="process_order.php" method="post">
    <label for="orderType">Pickup or Delivery</label>
    <select name="orderType" id="orderType"><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select>
    <label for="item">Select an item:</label>
    <select name="item" id="item"><option value="chicken_sandwich">Chicken Sandwich</option><option value="fries">Fries</option><option value="soft_drink">Soft Drink</option></select>
    <label for="quantity">Quantity:</label><input type="number" name="quantity" id="quantity" min="1" required>
    <div class="form-actions"><a href="checkOut.html" class="button-link">Checkout</a></div>
  </form></section>
  <section class="card"><h2>Menu Items</h2><table class="offer-table"><thead><tr><th>Item</th><th>Category</th></tr></thead><tbody><tr><td>Chicken Sandwich</td><td>Main</td></tr><tr><td>Fries</td><td>Side</td></tr><tr><td>Soft Drink</td><td>Drink</td></tr></tbody></table><div class="center-text"><p class="small-note">Click the logo to visit About Us:</p><img src="images/Burger-King-Logo.png" alt="Burger King information" usemap="#siteMap" width="100" height="100"><map name="siteMap"><area shape="rect" coords="0,0,100,100" href="aboutUs.html" alt="About Us"></map></div></section>
  </main>
  <footer><p>&copy; 2026 Burger King.</p></footer>
